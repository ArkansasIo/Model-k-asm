; Model QK default configuration
; Legacy Model K identifiers remain compatibility names.

[MODEL]
name=MODEL-QK
display_name=Model QK
legacy_name=MODEL-K
version=2
architecture=CLASSICAL_WITH_QUANTUM_INTERFACE
research_year=2026

[CPU]
word_bits=8
logical_value_bits=64
legacy_logical_value_bits=20
clock_hz=1000000

[MEMORY]
physical_record_bytes=64
legacy_physical_record_bytes=20
memory_backend=modern_memory_fabric
core_memory=lab_experimental
core_words=4096

[SEED]
enabled=true
algorithm=MKSEED64-V1
value=0x4D4B2026

[SHELL]
enabled=true
prompt=QK>

[QUANTUM]
enabled=true
interface=QISA
backend=QK-VQPU
simulator=statevector
max_qubits=24
procedural_generator=true
physical_plugins=superconducting,trapped_ion,neutral_atom,photonic

[DIAGNOSTICS]
boot_self_test=true
memory_backend_test=true
record_checksum=true
quantum_capability_test=true
