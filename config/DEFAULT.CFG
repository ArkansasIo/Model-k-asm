; Model K default configuration

[MODEL]
name=MODEL-K
version=1
architecture=CLASSICAL_WITH_OPTIONAL_QUANTUM

[CPU]
word_bits=8
logical_value_bits=20
clock_hz=1000000

[MEMORY]
physical_record_bytes=20
core_memory=enabled
core_words=4096

[SEED]
enabled=true
algorithm=MKSEED64-V1
value=0x4D4B2026

[SHELL]
enabled=true
prompt=MK>

[QUANTUM]
enabled=true
backend=simulator
max_qubits=16

[DIAGNOSTICS]
boot_self_test=true
core_memory_test=true
record_checksum=true
